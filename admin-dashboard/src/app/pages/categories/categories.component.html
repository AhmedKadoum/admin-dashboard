
<div class="card">
  <p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
  @if (loading()) {
  <p>⏳ Loading...</p>
  } @if (error()) {
  <p style="color: red">⚠️ {{ error() }}</p>
  }
  <!-- search -->
   <div class=" flex justify-center items-center mb-8">
  <form [formGroup]="searchForm" class="w-full md:w-1/3">
    <div class="p-input-icon-left w-100">
      <i class="pi pi-search"></i>
      <input
        pInputText
        type="text"
        placeholder="Search by name..."
        formControlName="search"
        class="w-90% mx-10 border p-3 bg-white rounded-lg shadow-md"
      />
    </div>
  </form>
</div>
   <!--  -->
  <p-table [value]="categories()|| [] "
           [paginator]="true"
           [rows]="5"
           [rowsPerPageOptions]="[5,10,20]"
           [tableStyle]="{ 'min-width': '30rem' }"
            [customSort]="true"
         (sortFunction)="onSort($event)">
    <ng-template pTemplate="header">
      <tr>
         <th pSortableColumn="id">ID <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
        <th>Medications</th>
        <th style="width: 100px">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-cat >
      <tr>
        <td>{{ cat.id }}</td>
        <td>{{ cat.name }}</td>
        <td>{{ cat.medications }}</td>
        <td>
          <button
            pButton
            icon="pi pi-pencil"
            class="p-button-rounded p-button-text p-button-sm"
            (click)="editCategory(cat)"
          ></button>
           <!--confirm   -->
           <p-confirmdialog>
               <ng-template #message let-message>
                   <div class="flex flex-col items-center w-full gap-4 border-b border-surface-200 dark:border-surface-700">
                       <i [ngClass]="message.icon" class="!text-6xl text-primary-500"></i>
                       <p>{{ message.message }}</p>
                   </div>
               </ng-template>
           </p-confirmdialog>
          <button
            pButton
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text p-button-sm"
            (click)="confirm(cat.id)"
          ></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="mt-3">
    <button
      pButton
      label="➕ Add Category"
      icon="pi pi-plus"
      class="p-button-success"
      (click)="addCategory()"
    ></button>
  </div>
</div>

 <!-- Dialog for Add/Edit -->
<p-dialog header="Category Form" [(visible)]="dialogueVisible" [modal]="true" [style]="{width: '400px'}">
  <form [formGroup]="CategoryForm" (ngSubmit)="saveCategory()" class="space-y-4">
    <div class="p-fluid space-y-4">

      <!-- Name -->
      <div class="field">
        <label for="Name" class="font-semibold text-gray-700">Name</label>
        <input id="Name" type="text" pInputText formControlName="name"
          class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500" />
      </div>
    </div>
    <p-footer>
      <button pButton label="Cancel" class="p-button-text" type="button" (click)="dialogueVisible=false"></button>
      <button pButton label="Save" class="p-button-primary" type="submit"></button>
    </p-footer>
</form>
</p-dialog>
