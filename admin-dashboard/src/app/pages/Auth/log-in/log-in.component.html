
<div class="fullscreen-center">
  <div class="login-container">
    <div class="login-form">
      <div class="login-header">
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to access your account</p>
      </div>

      <!-- Reactive form binding -->
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-input"
                 placeholder="Enter your username"
                 formControlName="username">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-container">
            <input type="password" id="password" class="form-input"
                   placeholder="Enter your password"
                   formControlName="password">
          </div>
        </div>

        <div class="remember-forgot">
          <div class="remember-me">
            <input type="checkbox" id="remember" class="checkbox">
            <label for="remember">Remember me</label>
          </div>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <!-- remove (click), use ngSubmit -->
        <button type="submit" class="login-button"
                [disabled]="loginForm.invalid">Login</button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR</span>
        <div class="divider-line"></div>
      </div>

      <div class="signup-section">
        <p class="signup-text">Don't have an account?</p>
        <a href="#" class="signup-button">Sign Up</a>
      </div>
    </div>

    <div class="login-image">
      <div class="image-content">
        <h2 class="image-title">Secure Login</h2>
        <p class="image-text">
          Your security is our priority. We use advanced encryption to protect your personal information.
        </p>
      </div>
    </div>
  </div>
</div>
<div class="mt-5 text-center flex flex-col gap-3">
  <div>
    {{token()}}
  </div>
  <div>
    {{users()}}
  </div>
  <div>
    {{error()}}
  </div>
  <div>
    {{loading()}}
  </div>
</div>
