
<div class="card">
  <p-breadcrumb [model]="items" [home]="home"></p-breadcrumb>
  <h2>Medications</h2>
  <div>{{loading()}}</div>

  @if (loading()) {
  <p>⏳ Loading...</p>
  } @if (error()) {
  <p style="color: red">⚠️ {{ error() }}</p>
  }

  <!-- <p-table [value]="Medications()?? []" [tableStyle]="{ 'min-width': '30rem' }"> -->
  <p-table [value]="localMedications || []"
           [paginator]="true"
           [rows]="5"
           [rowsPerPageOptions]="[5,10,20]"
           [tableStyle]="{ 'min-width': '30rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Image</th>
        <th>Barcode</th>
        <th style="width: 100px">Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-Med>
      <tr>
        <td>{{ Med.id }}</td>
        <td>{{ Med.name}}</td>
        <td><img src="{{ Med.image }}" alt=" not found" class="size-12"></td>
        <td>{{ Med.barCode}}</td>
        <td>
          <button
            pButton
            icon="pi pi-pencil"
            class="p-button-rounded p-button-text p-button-sm"
            (click)="editMedication(Med)"
          ></button>

          <button
            pButton
            icon="pi pi-trash"
            class="p-button-rounded p-button-danger p-button-text p-button-sm"
            (click)="deleteMedication(Med.id)"
          ></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="mt-3">
    <button
      pButton
      label="➕ Add Medication"
      icon="pi pi-plus"
      class="p-button-success"
      (click)="addMedication()"
    ></button>
  </div>
</div>
