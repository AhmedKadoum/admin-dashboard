
<p-dialog
    header="Header"
    [resizable]="false"
    [modal]="true"
    [maximizable]="true"
    appendTo="body"
    [(visible)]="dialogVisible"
    [style]="{ width: '75vw' }"
    [contentStyle]="{ height: '300px' }"
>
    <p-table [value]="currentPatients" [scrollable]="true" scrollHeight="flex" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template #header>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Dosage</th>
                <th>Quantity</th>
                <th>StartDate</th>
                <th>EndDate</th>
                <th>Frequency</th>
                <th>Status</th>
                <th>Notes</th>
            </tr>
        </ng-template>
        <ng-template #body let-pat>
            <tr>
                <td>{{ pat}}</td>
                <td>{{ pat.name }}</td>
                <td>{{ pat.country.name }}</td>
                <td>{{ pat.company }}</td>
                <td>{{ pat.representative.name }}</td>
            </tr>
        </ng-template>
    </p-table>
    <ng-template #footer>
        <p-button label="Ok" icon="pi pi-check" (onClick)="dialogVisible = false" />
    </ng-template>
</p-dialog>
